name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main # the script only run when push code on main

jobs:
  # JOB 1: check code quality and run test
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # install JDK 25 to run Maven (use action v4 to support Java new version)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      # step 1: check format code by using spotless
      # if code is not formated, CI/CD pipeline will suddenly fail right here
      - name: Check code formatting (Spotless)
        run: mvn spotless:check

      # step 2: run all Unit & Integration Test
      # GitHub Actions Ubuntu already have Docker so Testcontainers will run normally
      - name: Run Tests
        run: mvn test
  # JOB 2: Build Image and Deploy (only run if JOB 1 success)
  build-and-deploy:
    needs: test-and-lint # this is a fence to protect our system
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/flashcard-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo docker compose pull
            sudo docker compose up -d --force-recreate
            sudo docker image prune -a -f